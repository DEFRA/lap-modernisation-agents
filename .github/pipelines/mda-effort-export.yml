# Migration Delivery Agent - Excel export + Wiki append (build spec s13).
# Manual trigger only. The pipeline identity (Project Build Service) needs:
#   - Work items: read
#   - Wiki: EDIT   (separate grant - Analytics/work-item read does not cover wiki writes)
trigger: none
pr: none

parameters:
  - name: adoOrgUrl
    type: string
    default: https://dev.azure.com/<org>

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
  - script: python -m pip install pandas openpyxl
    displayName: Install export dependencies
  - script: python .github/scripts/pipeline/export_effort_excel.py
    displayName: Export effort records to Excel and append Wiki entry
    env:
      MDA_ADO_ORG_URL: ${{ parameters.adoOrgUrl }}
      MDA_ADO_PROJECT: $(System.TeamProject)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      BUILD_ID: $(Build.BuildId)
      OUT_DIR: $(Build.ArtifactStagingDirectory)
  - publish: $(Build.ArtifactStagingDirectory)
    artifact: migration-effort-export
    displayName: Publish Excel artifact
